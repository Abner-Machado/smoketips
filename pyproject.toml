[project]
name = "smoketips"
version = "0.1.0"
description = "Observability and governance for AI orchestration: watch, score, and govern the layers an orchestrator delegates to. Editable, traceable, file-based."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abner Machado" }]
keywords = ["ai-agents", "orchestration", "observability", "governance", "mcp", "llm", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
smoketips = "smoketips.cli:main"

[project.urls]
Homepage = "https://github.com/Abner-Machado/smoketips"
Repository = "https://github.com/Abner-Machado/smoketips"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smoketips"]

[dependency-groups]
dev = ["pytest>=8.0"]
